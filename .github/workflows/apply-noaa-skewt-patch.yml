name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/synop-cycle.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock Maps SYNOP to sounding 00Z/12Z
        run: |
          set -e
          if grep -F 'let latestRep=null' index.html; then
            patch -p1 < patches/synop-cycle.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'SYNOP only at same 00Z/12Z cycle as the Skew-T'
            git push
          else
            echo 'cycle lock already applied'
          fi
