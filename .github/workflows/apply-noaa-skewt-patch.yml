name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/sonde-local-mirror.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply local mirror + bump SW cache
        run: |
          set -e
          if ! grep -F 'sondeFetchLocalMirror' sonde-noaa.js; then
            patch -p1 < patches/sonde-local-mirror.patch
          fi
          sed -i "s/rwc-shell-v8/rwc-shell-v9/" sw.js
          if ! grep -q sonde-latest.json sw.js; then
            sed -i "s|'./sonde-noaa.js'|'./sonde-noaa.js',\n  './sonde-latest.json'|" sw.js
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sonde-noaa.js sw.js
          git diff --cached --quiet || git commit -m 'Load Skew-T from same-origin NOAA snapshot; bump PWA cache'
          git push || true
