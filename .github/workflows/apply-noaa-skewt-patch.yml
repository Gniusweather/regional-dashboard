name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write working module pages
        run: |
          python3 << 'PY'
          from pathlib import Path
          sw=Path('sw.js').read_text().replace('rwc-shell-v21','rwc-shell-v22').replace('rwc-shell-v20','rwc-shell-v22')
          if './overzicht.html' not in sw:
              sw=sw.replace("'./favicon-32.png'", "'./favicon-32.png',\n  './atc.html',\n  './encoders.html',\n  './overzicht.html'")
          Path('sw.js').write_text(sw)
          print('sw', [ln for ln in sw.splitlines() if 'CACHE' in ln][0])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js
          git diff --cached --quiet || git commit -m 'Bump SW to v22 for ATC/encoder/Overzicht'
          git push
