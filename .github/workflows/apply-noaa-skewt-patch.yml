name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        run: |
          python3 << 'END'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          t = t.replace("srcUrl?`<a class=\"sonde-link\"", "`<a class=\"sonde-link\"", 1)
          t = t.replace("TTBB raw UKNU01 \u2197</a>`:''", "TTBB raw UKNU01 \u2197</a>`")
          t = t.replace("TTBB raw UKNU01 ↗</a>`:''", "TTBB raw UKNU01 ↗</a>`")
          p.write_text(t)
          print('srcUrl leftover', t.count('srcUrl?`<a'))
          print('bad ternary leftover', ":''" in t[t.find('TTBB raw'):t.find('TTBB raw')+80] if 'TTBB raw' in t else 'no')
          sw = Path('sw.js').read_text().replace('rwc-shell-v15', 'rwc-shell-v16')
          Path('sw.js').write_text(sw)
          END
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix sounding-link syntax error that crashed the app'
          git push
