name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/speci_notify.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPECI ntfy alerts
        run: |
          python3 patches/speci_notify.py
          python3 -c "from pathlib import Path; p=Path('sw.js'); t=p.read_text().replace('rwc-shell-v48','rwc-shell-v49').replace('rwc-shell-v47','rwc-shell-v49'); p.write_text(t); print(t.splitlines()[1])"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Alert on SPECI for TNCA, TNCB, TNCC (ntfy + browser)'
          git push
