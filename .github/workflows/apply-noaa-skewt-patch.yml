name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/synop_78988_watch.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 78988 SYNOP SI/SM watch
        run: |
          python3 patches/synop_78988_watch.py
          python3 -c "from pathlib import Path; p=Path('sw.js'); t=p.read_text().replace('rwc-shell-v46','rwc-shell-v47').replace('rwc-shell-v45','rwc-shell-v47'); p.write_text(t); print(t.splitlines()[1])"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m '78988 SYNOP watch: SI/SM poll T-5..T+15, ntfy new/missing/NIL/bad, 08-21 AST'
          git push
