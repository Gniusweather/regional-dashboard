name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/island-avg.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add island average tile
        run: |
          set -e
          if grep -F "else label='☁ '+Math.round(cl.baseP)+'hPa'" index.html || grep -F 'function renderStationsList' index.html && ! grep -F 'islandAverageRow' index.html; then
            patch -p1 < patches/island-avg.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Add Island average tile; Skew-T cloud labels in feet'
            git push
          else
            echo 'already applied'
          fi
