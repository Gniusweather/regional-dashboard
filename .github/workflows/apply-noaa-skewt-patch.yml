name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap Windy iframes to Ventusky no-wind-anim
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          def vent(layer, zoom):
              return f'https://embed.ventusky.com/?p=12.35;-69.15;{zoom}&l={layer}&w=off&lang=en'
          def repl(m):
              u=m.group(0)
              ov=re.search(r'overlay=([^&#]+)', u)
              z=re.search(r'zoom=(\d+)', u)
              overlay=(ov.group(1) if ov else 'rain')
              zoom=z.group(1) if z else '7'
              layer={
                'satellite':'satellite',
                'radar':'radar',
                'rain':'rain-1h',
                'dustsm':'dust',
                'wind':'wind',
              }.get(overlay,'rain-1h')
              return vent(layer, zoom)
          t2,n=re.subn(r'https://embed\.windy\.com/embed2\.html[^"\']+', repl, t)
          print('replaced', n)
          p.write_text(t2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Replace Windy embeds with Ventusky (wind animation off)'
          git push
