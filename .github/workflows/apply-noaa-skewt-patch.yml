name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/perf_ae.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply A-E performance and bug fixes
        run: |
          python3 patches/perf_ae.py
          python3 -c "from pathlib import Path; p=Path('sw.js'); t=p.read_text().replace('rwc-shell-v41','rwc-shell-v42').replace('rwc-shell-v40','rwc-shell-v42'); p.write_text(t); print(t.splitlines()[1])"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Perf/bugs A-E: stations map restore, no boot maps, clock pause, leaflet CSS on demand, IO maps'
          git push
