name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/no-cloud-bar.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove cloud bars
        run: |
          set -e
          if grep -F "ctx.fillRect(g.pad.l,yTop,g.plotW,h);" index.html; then
            patch -p1 < patches/no-cloud-bar.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Skew-T: cloud icon and feet only, no blue layer bar'
            git push
          else
            echo already applied
          fi
