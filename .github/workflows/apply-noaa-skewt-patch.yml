name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/restore_parcel.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore parcel and CAPE fill
        run: |
          python3 patches/restore_parcel.py
          python3 -c "from pathlib import Path; p=Path('sw.js'); t=p.read_text().replace('rwc-shell-v32','rwc-shell-v33').replace('rwc-shell-v31','rwc-shell-v33'); p.write_text(t); print(t.splitlines()[1])"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Restore blue parcel path and CAPE/CIN shading'
          git push
