name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ventusky wind GFS
        run: |
          python3 << 'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text()
          old='https://embed.ventusky.com/?p=12.35;-69.15;7&l=wind&m=harmonie_car&w=off&lang=en'
          new='https://embed.ventusky.com/?p=12.35;-69.15;7&l=wind&m=gfs&w=off&lang=en'
          print('found', t.count(old))
          t=t.replace(old,new)
          p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Ventusky wind map uses GFS (HARMONIE has no wind)'
          git push
