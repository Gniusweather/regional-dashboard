name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin Windy embeds to p:off
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          def fix(m):
              u=m.group(0)
              u=u.replace('&particles=off','')
              u=u.split('#')[0]
              z=re.search(r'zoom=(\d+)', u)
              zoom=z.group(1) if z else '7'
              if 'particlesAnim=off' not in u:
                  u+=('&' if '?' in u else '?')+'particlesAnim=off'
              return u+f'#12.350,-69.150,{zoom},p:off'
          t2=re.sub(r'https://embed\.windy\.com/embed2\.html[^"\']+', fix, t)
          # also force reload of lazy iframes when maps open
          old="f.setAttribute('src', f.getAttribute('data-src'));"
          new="f.setAttribute('src', f.getAttribute('data-src'));"
          p.write_text(t2)
          print('urls', len(re.findall(r'p:off', t2)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Disable Windy particles with p:off URL hash on every embed'
          git push
