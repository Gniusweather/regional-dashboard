name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/add_atc_nav.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nav + placeholder pages
        run: |
          python3 patches/add_atc_nav.py
          python3 << 'PY'
          from pathlib import Path
          if not Path('atc.html').exists():
              Path('atc.html').write_text('<!doctype html><meta charset=utf-8><title>ATC</title><style>body{margin:0;background:#0b1220}</style><iframe src="https://globe.adsbexchange.com/?lat=12.22&lon=-69.10&zoom=9" style="width:100%;height:70vh;border:0"></iframe><p style="color:#8ea0b8;font-family:sans-serif;padding:8px 12px">LiveATC: <a href="https://www.liveatc.net/search/?icao=TNCC" style="color:#55c1ff">TNCC</a> · <a href="https://www.liveatc.net/search/?icao=TNCA" style="color:#55c1ff">TNCA</a> · <a href="https://www.liveatc.net/search/?icao=TNCB" style="color:#55c1ff">TNCB</a></p>\n')
          if not Path('encoders.html').exists():
              Path('encoders.html').write_text('<!doctype html><meta charset=utf-8><title>SYNOP Encode</title><body style="margin:0;background:#0b1220;color:#e8eef8;font-family:sans-serif;padding:16px"><h2>SYNOP encoder</h2><p>Encode / Sutron / Vaisala form is being attached. Use Reports in this SYNOP tab for decoded bulletins.</p></body>\n')
          print('pages', Path('atc.html').exists(), Path('encoders.html').exists())
          sw=Path('sw.js').read_text().replace('rwc-shell-v20','rwc-shell-v21').replace('rwc-shell-v19','rwc-shell-v21')
          Path('sw.js').write_text(sw)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js atc.html encoders.html
          git diff --cached --quiet || git commit -m 'Add ATC nav button and ATC/encoder pages'
          git push
