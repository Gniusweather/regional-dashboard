name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/desktop-skewt.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge desktop Skew-T
        run: |
          set -e
          if grep -F 'height:640px' index.html; then
            patch -p1 < patches/desktop-skewt.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Optimize Skew-T size for desktop while keeping phone layout'
            git push
          else
            echo 'desktop size already applied'
          fi
