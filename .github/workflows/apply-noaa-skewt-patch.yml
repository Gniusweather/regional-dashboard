name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/drop_vaisala_add_daysummary.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop Vaisala and add Day summary
        run: |
          python3 patches/drop_vaisala_add_daysummary.py
          python3 -c "from pathlib import Path; p=Path('sw.js'); t=p.read_text().replace('rwc-shell-v22','rwc-shell-v23').replace('rwc-shell-v21','rwc-shell-v23'); p.write_text(t); print(t.splitlines()[1])"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add encoders.html index.html sw.js
          git diff --cached --quiet || git commit -m 'Remove Vaisala from encoder; add SYNOP Day summary'
          git push
