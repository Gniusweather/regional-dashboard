name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/avg-first-frz-ft.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          grep -n 'station-card is-avg' index.html | head
          if grep -F 'list.innerHTML+=`' index.html | grep -q is-avg; then
            echo MATCH_PLUS_EQ
          fi
          patch -p1 --forward < patches/avg-first-frz-ft.patch || patch -p1 < patches/avg-first-frz-ft.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && echo NOCHANGE || git commit -m 'Put Island average first; show freezing level in feet'
          git push
