name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feet-only labels and TTBB plot
        run: |
          python3 << 'PY'
          from pathlib import Path
          idx=Path('index.html'); t=idx.read_text()
          t=t.replace("const label=`${ftStr}ft · ${Math.round(h)}m`;","const label=ftStr+'ft';")
          t=t.replace('NOAA raw TEMP · TNCC 78988 · COD layout','NOAA TTAA+TTBB · TNCC 78988 · heights ft')
          t=t.replace('with feet added alongside the meters','feet only')
          idx.write_text(t)
          js=Path('sonde-noaa.js'); s=js.read_text()
          old='''const profile=[...merged.values()].filter(lv=>{\n      if(lv.t==null||!(lv.p>=50&&lv.p<=1100)) return false;\n      if(lv.t>45||lv.t<-90) return false;\n      if(lv.p>=850 && lv.t<-5) return false;\n      if(lv.p>=700 && lv.t<-20) return false;\n      if(lv.p>=400 && lv.t<-50) return false;\n      return true;\n    }).sort((a,b)=>b.p-a.p);'''
          new='''const profile=[...merged.values()].filter(lv=>{\n      if(lv.t==null||!(lv.p>=70&&lv.p<=1100)) return false;\n      if(lv.t>48||lv.t<-95) return false;\n      return true;\n    }).sort((a,b)=>b.p-a.p);'''
          print('filter block', old in s)
          if old in s: s=s.replace(old,new,1)
          js.write_text(s)
          sw=Path('sw.js').read_text()
          if "rwc-shell-v11" in sw:
              Path('sw.js').write_text(sw.replace("const CACHE = 'rwc-shell-v11';","const CACHE = 'rwc-shell-v12';"))
          elif "rwc-shell-v12" in sw:
              Path('sw.js').write_text(sw.replace("const CACHE = 'rwc-shell-v12';","const CACHE = 'rwc-shell-v13';"))
          print('label', "ftStr+'ft'" in t or 'ftStr+\'ft\'' in t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sonde-noaa.js sw.js
          git diff --cached --quiet || git commit -m 'Skew-T height labels in feet only; plot all TTAA+TTBB levels'
          git push
