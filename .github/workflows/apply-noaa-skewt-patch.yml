name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Footer level count
        run: |
          python3 << 'END'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = "NOAA TTAA+TTBB · TNCC 78988 · heights ft"
          new = "NOAA TTAA+TTBB · '+prof.length+' lvls · heights ft"
          # current is a string literal in fillText
          a = "'NOAA TTAA+TTBB · TNCC 78988 · heights ft'"
          b = "'NOAA TTAA+TTBB · '+prof.length+' lvls · heights ft'"
          print('found', a in t)
          t = t.replace(a, b, 1)
          p.write_text(t)
          sw = Path('sw.js').read_text().replace('rwc-shell-v13','rwc-shell-v14').replace('rwc-shell-v12','rwc-shell-v14')
          Path('sw.js').write_text(sw)
          END
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Skew-T footer shows TTAA+TTBB merged level count'
          git push
