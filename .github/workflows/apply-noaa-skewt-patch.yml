name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/bust_ios_cache.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust iOS PWA scripts
        run: |
          python3 patches/bust_ios_cache.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Cache-bust sonde-noaa.js and SW for iOS homescreen'
          git push
