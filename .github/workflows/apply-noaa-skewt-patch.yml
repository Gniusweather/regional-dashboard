name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/cod-skewt-style.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply COD layout if old tall box is present
        run: |
          set -e
          if grep -F 'height:920px' index.html; then
            patch -p1 < patches/cod-skewt-style.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'COD-style Skew-T: red T, green Td, right indices, phone size'
            git push
          else
            echo 'COD layout already applied'
          fi
