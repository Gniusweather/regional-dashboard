name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - patches/restore-sonde-fallback.patch
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore NOAA-first with fallback if needed
        run: |
          set -e
          if grep -q 'function sondeUrls(dt){ return []; }' index.html; then
            patch -p1 < patches/restore-sonde-fallback.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'NOAA raw first for Skew-T; keep indices/SYNOP; Wyoming text fallback'
            git push
          else
            echo 'fallback already present; nothing to apply'
          fi
