name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mirror dt fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sonde-noaa.js')
          t=p.read_text()
          t2=t.replace('return {parsed,url:SONDE_NOAA_RAW.TTAA,dt:parsed.dt||new Date()};','return {parsed,url:SONDE_NOAA_RAW.TTAA,dt:parsed.dt||null};')
          # drop unused leftover
          i=t2.find('async function sondeFetchNoaaRaw_UNUSED')
          if i>0: t2=t2[:i].rstrip()+'\n'
          p.write_text(t2)
          print('changed', t!=t2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sonde-noaa.js
          git diff --cached --quiet || git commit -m 'Score NOAA mirror by sounding time, not fetch clock'
          git push
