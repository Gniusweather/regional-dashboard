name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/synop_order_fonts.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SYNOP order and fonts
        run: |
          python3 patches/synop_order_fonts.py
          python3 -c "from pathlib import Path; p=Path('sw.js'); t=p.read_text().replace('rwc-shell-v50','rwc-shell-v51').replace('rwc-shell-v49','rwc-shell-v51'); p.write_text(t); print(t.splitlines()[1])"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'SYNOP: TNCC on top, TNCA below; slightly larger fonts'
          git push
