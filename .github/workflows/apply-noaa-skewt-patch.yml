name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
      - patches/fix_red_trace.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix spiked temperature trace
        run: |
          python3 patches/fix_red_trace.py
          python3 -c "from pathlib import Path; p=Path('sw.js'); t=p.read_text().replace('rwc-shell-v28','rwc-shell-v29').replace('rwc-shell-v27','rwc-shell-v29'); p.write_text(t); print(t.splitlines()[1])"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sonde-noaa.js index.html sw.js
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Fix spiked red temperature trace on Skew-T'
          git push
