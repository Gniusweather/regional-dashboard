name: Apply NOAA Skew-T patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-noaa-skewt-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add TTBB raw link
        run: |
          python3 -c "
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text()
          old='Full sounding text data ↗</a>`:\'\''
          new='TTAA raw (mandatory) ↗</a>`,\n    \`<a class=\"sonde-link\" href=\"https://tgftp.nws.noaa.gov/data/raw/uk/uknu01.tncc..txt\" target=\"_blank\" rel=\"noopener\">TTBB raw (significant levels) ↗</a>`'
          print('found', old in t)
          # simpler
          needle='Full sounding text data ↗</a>`'
          print('needle', t.count(needle))
          t=t.replace(needle,'TTAA raw (mandatory) ↗</a>`,\n    `<a class="sonde-link" href="https://tgftp.nws.noaa.gov/data/raw/uk/uknu01.tncc..txt" target="_blank" rel="noopener">TTBB raw (significant levels) ↗</a>`',1)
          p.write_text(t)
          sw=Path('sw.js').read_text()
          sw=sw.replace(\"rwc-shell-v12\",\"rwc-shell-v13\").replace(\"rwc-shell-v11\",\"rwc-shell-v13\")
          Path('sw.js').write_text(sw)
          "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Link both TTAA and TTBB raw NOAA files on sounding'
          git push
