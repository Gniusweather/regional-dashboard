name: SounderPy TNCC plot
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
    - cron: '20 12 * * *'
  push:
    paths:
      - scripts/plot_sounderpy.py
      - .github/workflows/sounderpy-tncc.yml
permissions:
  contents: write
jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SounderPy
        run: |
          python -m pip install -U pip
          pip install sounderpy matplotlib numpy pandas metpy siphon
      - name: Plot
        run: python scripts/plot_sounderpy.py
      - name: Commit image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p plots
          ls -la plots || true
          git add plots scripts/plot_sounderpy.py
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Update SounderPy TNCC sounding plot'
          git push
